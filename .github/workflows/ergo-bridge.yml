# Builds the Ergo Bridge installers on each OS and publishes them to the GitHub release v<desktop/package.json version>.
# The web app links to releases/latest/download/<installer>, so a published release is live immediately.
# To release: bump "version" in desktop/package.json, commit, then run this workflow from the Actions tab.
name: Ergo Bridge release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist -- ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
