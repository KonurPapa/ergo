# Builds the Ergo Bridge installers on each OS and publishes them as the GitHub release v<desktop/package.json version>.
# The web app links to releases/latest/download/<installer>, so the release is live for users as soon as this finishes.
# To release: bump "version" in desktop/package.json, commit, push, then run this workflow from the Actions tab.
name: Ergo Bridge release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            files: |
              desktop/release/Ergo-Bridge-Setup.exe
              desktop/release/Ergo-Bridge-Setup.exe.blockmap
              desktop/release/latest.yml
          # Pinned, not ubuntu-latest: node-pty is compiled here and links against the runner's glibc (see the check below).
          - os: ubuntu-24.04
            platform: --linux
            files: |
              desktop/release/Ergo-Bridge.AppImage
              desktop/release/latest-linux.yml
          - os: macos-latest
            platform: --mac
            files: |
              desktop/release/Ergo-Bridge.dmg
              desktop/release/Ergo-Bridge.zip
              desktop/release/*.blockmap
              desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    # Unsigned macOS builds are best-effort; they must not hold back the Windows and Linux release.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The bridge sources live outside desktop/ and resolve their type imports from the root node_modules.
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run dist -- ${{ matrix.platform }} --publish never
        working-directory: desktop
      # node-pty ships no Linux prebuild, so npm compiles it on the runner against the runner's glibc. v0.7.0 was built
      # after ubuntu-latest moved past glibc 2.42; its pty.node wouldn't load on Ubuntu 24.04, Mint 22 or Debian 12, and
      # every task failed to start. Fail the release instead of shipping that.
      - name: Check native modules load on glibc 2.35 (Ubuntu 22.04)
        if: matrix.platform == '--linux'
        working-directory: desktop
        run: |
          max=2.35
          files=$(find release/linux-unpacked/resources/app/node_modules \( -name '*.node' -o -name '*.so' -o -name '*.so.*' \))
          echo "$files" | grep -q 'node-pty/build/Release/pty.node' || { echo "::error::pty.node is missing from the app"; exit 1; }
          bad=0
          for f in $files; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_2\.[0-9]*' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)
            echo "glibc ${need:-none}  $f"
            if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$max" | sort -V | tail -1)" != "$max" ]; then
              echo "::error::$f needs glibc $need, newer than $max"
              bad=1
            fi
          done
          exit $bad
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          # Windows and Linux are required; the onboarding links to these exact names.
          for f in Ergo-Bridge-Setup.exe latest.yml Ergo-Bridge.AppImage latest-linux.yml; do
            test -f "artifacts/$f" || { echo "::error::Missing $f"; exit 1; }
          done
          ls -la artifacts
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" artifacts/* --clobber
          else
            gh release create "$version" artifacts/* --target "$GITHUB_SHA" --title "Ergo Bridge $version" --latest \
              --notes "Download Ergo Bridge for your computer. Windows: Ergo-Bridge-Setup.exe · Linux: Ergo-Bridge.AppImage · macOS (Apple Silicon, unsigned): Ergo-Bridge.dmg"
          fi
