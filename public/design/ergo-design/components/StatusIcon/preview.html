<!-- @dsCard group="Status" height=120 subtitle="Task status and priority glyphs" -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="root" style="padding:20px"></div>
<script>
var E = window.Ergo, h = React.createElement, F = React.Fragment;

var s = ["todo","queued","progress","review","done","failed"], p = ["none","low","medium","high","urgent"];
ReactDOM.createRoot(document.getElementById("root")).render(h("div",{style:{display:"flex",flexDirection:"column",gap:14}},
  h("div",{style:{display:"flex",gap:18}}, s.map(function(x){ return h("span",{key:x,className:"eg-hstack",style:{fontSize:12}}, h(E.StatusIcon,{status:x}), E.STATUS_LABEL[x]); })),
  h("div",{style:{display:"flex",gap:18}}, p.map(function(x){ return h("span",{key:x,className:"eg-hstack",style:{fontSize:12}}, h(E.PriorityIcon,{priority:x}), E.PRIO_LABEL[x]); }))
));
</script>
</body></html>
