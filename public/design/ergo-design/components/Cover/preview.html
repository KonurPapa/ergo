<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--canvas); }
  svg { position: absolute; inset: 0; }
  .b { rx: var(--radius-md); ry: var(--radius-md); }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .s3 { fill: var(--surface-3); }
  .tint { fill: var(--accent-text); }
  .ok { fill: var(--success); }
  .dot { fill: var(--line-control); }
  .txt { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 600; font-size: 120px; line-height: .92; letter-spacing: -4px; color: var(--ink); }
  .tag { margin: 14px 0 0; font-family: var(--font-sans); font-size: 13px; line-height: 20px; color: var(--ink-subtle); }
</style></head>
<body><div class="cv">
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<!--
blocks: accent 432x48 (bleeds right), ink 240x48, surface-3 320x48, accent-text 160x48, success disc 48 (radius-full) — rows of a task list

pattern: dot grid, row "precise, technical, mono, a 4px grid" — Ergo is a dense keyboard-first developer tool; dots in line-control at space-4 pitch, 6x8 = 48 units
scales: band height space-12 (48px), gap space-2 (8px), dot pitch space-4 (16px), band corners radius-md (8px), disc radius-full
-->
