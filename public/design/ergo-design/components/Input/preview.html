<!-- @dsCard group="Forms" height=250 subtitle="Text input, search, field with help and error, checkbox, switch" -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="root" style="padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"></div>
<script>
var E = window.Ergo, h = React.createElement, F = React.Fragment;

ReactDOM.createRoot(document.getElementById("root")).render(h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,width:620}},
  h(E.Field,{label:"Project folder",help:"Ergo reads and writes TODO.md here."}, h(E.Input,{defaultValue:"~/code/ergo",mono:true})),
  h(E.Field,{label:"Search"}, h(E.Input,{icon:"search",placeholder:"Search tasks",kbd:"/"})),
  h(E.Field,{label:"Anthropic API key",error:"Key was rejected by the provider."}, h(E.Input,{defaultValue:"sk-ant-•••••••••••",invalid:true,mono:true})),
  h("div",{style:{display:"flex",flexDirection:"column",gap:12,paddingTop:22}},
    h("label",{className:"eg-hstack"}, h(E.Checkbox,{defaultChecked:true}), "Run tests before marking done"),
    h("label",{className:"eg-hstack"}, h(E.Checkbox,{}), "Ask before running shell commands"),
    h("label",{className:"eg-hstack"}, h(E.Switch,{defaultChecked:true}), "Index this folder"))
));
</script>
</body></html>
