<!-- @dsCard group="Actions" height=80 subtitle="Shortcut hints" -->
<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="root" style="padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"></div>
<script>
var E = window.Ergo, h = React.createElement, F = React.Fragment;

ReactDOM.createRoot(document.getElementById("root")).render(h(F,null,
  h("span",{className:"eg-hstack eg-subtle"}, "Command palette", h(E.Kbd,{keys:["⌘","K"]})),
  h("span",{className:"eg-hstack eg-subtle"}, "Toggle done", h(E.Kbd,{keys:["⌘","↵"]})),
  h("span",{className:"eg-hstack eg-subtle"}, "Run task", h(E.Kbd,{keys:["⇧","⌘","↵"]})),
  h("span",{className:"eg-hstack eg-subtle"}, "Open brief", h(E.Kbd,{keys:["⌘","J"]})),
  h("span",{className:"eg-hstack eg-subtle"}, "Move", h(E.Kbd,{keys:["⌥","↑"]}))
));
</script>
</body></html>
